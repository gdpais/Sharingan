name: SharinganWidgetExtension
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  Sharingan:
    path: ..
targets:
  SharinganWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../Sources/SharinganWidget
    dependencies:
      - package: Sharingan
        product: SharinganCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sharingan
        CFBundleName: SharinganWidget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SharinganTeamID: "$(SHARINGAN_TEAM_ID)"
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGNING_ALLOWED: false
        ENABLE_DEBUG_DYLIB: false
        ENABLE_APP_SANDBOX: true
        INFOPLIST_KEY_SharinganTeamID: "$(SHARINGAN_TEAM_ID)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: "$(SHARINGAN_WIDGET_BUNDLE_ID)"
        PRODUCT_NAME: SharinganWidget
        SWIFT_VERSION: "6.0"
